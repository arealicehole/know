families:
  F01_box_logo_hype:
    id: F01
    name: box_logo_hype
    module: >-
      Style family: hype box-logo plaque energy (original mark only).
      Form: centered rectangular plaque with thick border and optional lower bar stack.
      Type: bold condensed sans, all-caps short wordmark.
      Density: low to medium, high negative space inside the plaque.
      Palette: high-contrast two or three colors.
    do: [perfect alignment, thick counters, instant thumbnail read]
    dont: [copy real box logos, trademark slogans, tiny corporate left-chest only]
    default_edge: sharp_rect
    default_palette: hype_mono

  F02_handstyle_script:
    id: F02
    name: handstyle_script
    module: >-
      Style family: graffiti handstyle script wordmark as the entire graphic.
      Form: one continuous signature cluster with consistent slant and one flourish only.
      Type: thick marker script with outline and fill.
      Density: medium; lettering is the art.
    do: [stable baseline, readable at small size, solid drip teardrops if any]
    dont: [illegible wildstyle for retail, celebrity fake tags]
    default_edge: character_contour
    default_palette: hype_mono

  F03_varsity_crest:
    id: F03
    name: varsity_crest
    module: >-
      Style family: varsity letterman crest badge.
      Form: shield or crest with arched banner, twin supporters, optional year.
      Type: chunky varsity block plus arched banner sans.
      Motifs: original twin cannabis leaves or beasts, stars, thick outline.
    do: [symmetry, thick borders, collegiate color pairs]
    dont: [real university or league marks]
    default_edge: badge
    default_palette: gas_og

  F04_workwear_patch:
    id: F04
    name: workwear_patch
    module: >-
      Style family: workwear utility patch badge.
      Form: oval or octagon patch with dashed stitch border.
      Type: condensed industrial sans, stamped small caps.
      Palette: muted earth ochre olive brick cream.
    do: [patch silhouette, worn texture only inside hard mask]
    dont: [real workwear brand logos]
    default_edge: badge
    default_palette: work_drab

  F05_camo_plaque:
    id: F05
    name: camo_plaque
    module: >-
      Style family: camouflage fill confined inside a plaque (NOT all-over print).
      Form: rounded rectangle, dog-tag, or shield with thick border; camo stops at border.
      Type: stencil sans wordmark.
    do: [camo as fill only, hard outer contour]
    dont: [full-frame seamless camo, AOP]
    default_edge: sharp_rect
    default_palette: gas_og

  F06_skate_flame:
    id: F06
    name: skate_flame
    module: >-
      Style family: skate board-graphic flame language.
      Form: twin solid cel-shaded flames, optional wheel or bolt icons, thick black outlines.
      Palette: black with orange yellow fire or alt teal pink.
    do: [closed solid flame tips, bold cartoon fire]
    dont: [wispy alpha smoke, real magazine logos]
    default_edge: character_contour
    default_palette: hype_mono

  F07_luxury_monogram:
    id: F07
    name: luxury_monogram
    module: >-
      Style family: luxury-street monogram plaque.
      Form: original interlocking initials pattern inside double-line frame; not infinite AOP.
      Palette: black gold, cream brown, navy silver, or monochrome.
    do: [framed field, optical balance, generous outer margin]
    dont: [famous fashion monogram clones]
    default_edge: sharp_rect
    default_palette: gelato_cream

  F08_y2k_chrome_candy:
    id: F08
    name: y2k_chrome_candy
    module: >-
      Style family: Y2K chrome candy street graphic.
      Form: bubbly chrome wordmark, star bursts as solid shapes, glossy highlight shapes, neon accents.
      Palette: hot pink lime cobalt chrome silver.
    do: [clustered center composition, cel chrome not photo bokeh]
    dont: [full UI screenshot backgrounds]
    default_edge: sharp_rect
    default_palette: candy_runtz

  F09_reggae_roots:
    id: F09
    name: reggae_roots
    module: >-
      Style family: reggae roots badge.
      Form: circular sun disc badge, red gold green black, original leaf and optional original lion.
      Type: arched bold display.
    do: [joyful geometry, respectful color grammar]
    dont: [real artist likeness, sacred symbol abuse, lazy stereotype clipart]
    default_edge: circle
    default_palette: roots_triad

  F10_psych_70s_travel:
    id: F10
    name: psych_70s_travel
    module: >-
      Style family: 1970s psychedelic travel poster plaque.
      Form: ornate framed poster rectangle, wavy display type, posterized color bands (no soft airbrush-only).
      Palette: avocado mustard burnt orange violet cream.
    do: [posterize gradients to hard bands, single poster edge]
    dont: [infinite mandala bleed, soft alpha]
    default_edge: sharp_rect
    default_palette: psych_70s

  F11_punk_grunge_diy:
    id: F11
    name: punk_grunge_diy
    module: >-
      Style family: punk DIY xerox zine graphic.
      Form: jagged opaque paper polygon mask, high contrast B/W plus one accent, stamped mixed type.
      Texture: grunge only inside hard mask.
    do: [hard torn-paper silhouette, readable main word]
    dont: [real band logos, pure illegibility]
    default_edge: jagged_diy
    default_palette: hype_mono

  F12_mascot_beast:
