pack_roles:
  hero:
    module: >-
      Pack role: HERO. Maximum brand signal. One clear focal mass, 1-2 text lines max,
      strongest silhouette, standard or oversized front detail level.
  minimal:
    module: >-
      Pack role: MINIMAL. Everyday tee. Single word or icon, sparse density, luxury of empty margin,
      still isolated hard-edge transfer.
  parody:
    module: >-
      Pack role: PARODY ENERGY only. Original slogan and layout jokes; never counterfeit a real mark.
      Prefer sports-broadcast, fake warning, or tourist-poster energy with invented names.
  crest:
    module: >-
      Pack role: CREST. Collegiate or roots badge structure, arched type, twin supporters, year optional.
  mascot:
    module: >-
      Pack role: MASCOT. Character-first composition, bold outlines, name arched under optional.

