version: "1.0.0"
task_id: "t_1eefb647"
updated: "2026-10-03"
model_target: "Qwen-Image-2.1"

locked_prefix: |
  Subject: isolated DTF chest transfer graphic for streetwear t-shirt
  Medium: bold vector-like apparel graphic, cel shading or clean flat print design
  Background: pure transparent background, no scene, no fabric, no mockup
  Edges: hard silhouette, clean cut edge, no feathering, no outer glow
  Composition: centered single graphic, generous empty margin, not all-over print, not seamless pattern

locked_negative: >-
  all-over print, AOP, seamless pattern, full bleed, edge-to-edge, repeating tile,
  garment mockup, model wearing shirt, photograph of t-shirt, fabric texture background,
  soft smoke fading to transparent, feathered edges, outer glow, white square background,
  grey checkerboard, blurry, lowres, watermark, real brand logos, Supreme box logo,
  Stussy, Bape, Carhartt, Thrasher, Nike, Adidas, copyrighted cartoon characters,
  extra limbs, messy microtext, illegible letters

assembly_order:
  - locked_prefix
  - family_module
  - strain_module
  - text_block
  - levers
  - dtf_reminder
  - locked_negative

dtf_reminder: >-
  DTF transfer ready, sticker-like isolated shape, opaque colors, hard cut path,
  print-safe bold lines, transparent background only

variation_levers:
  pack_role: [hero, minimal, parody, crest, mascot]
  density: [sparse, medium, packed]
  palette_mode: [mono, duo, triad, candy, roots, psych, work_drab, marker_night, gas_og, gelato_cream, lcg_jewel]
  type_mode: [none, single_word, stacked, arched, handstyle]
  edge_mode: [sharp_rect, badge, circle, jagged_diy, character_contour]
  finish: [flat, cel, halftone_shade, chrome_cel, distressed_inside_mask]
  scale_intent: [left_chest, standard_front, oversized_front]
  parody_energy: [none, sports_broadcast, warning_label_gag, luxury_flex, tourist_poster]

